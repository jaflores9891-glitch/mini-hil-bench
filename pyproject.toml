[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-hil-bench"
version = "0.1.0"
description = "Virtual HIL test bench for an AEB ECU over CAN, with a pytest test framework."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "python-can>=4.3",
    "cantools>=39",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-html>=4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "D", "PTH", "RET"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "smoke: quick bench sanity checks",
    "regression: nominal scenarios per requirement",
    "edge_case: boundary values around thresholds",
    "fault_injection: tests that inject CAN faults through the gateway",
    "stress: bus load tests",
    "req(*ids): requirement IDs covered by the test (traceability)",
]
